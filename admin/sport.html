<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sport | Dale College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <span class="brand-mark">DC</span>
                <div>
                    <strong>Dale College</strong>
                    <small>Content desk</small>
                </div>
            </div>

            <nav class="admin-tabs" aria-label="Content sections">
                <a class="tab-button" href="index.html">Overview</a>
                <a class="tab-button" href="news.html">News</a>
                <a class="tab-button active" href="sport.html">Sport</a>
                <a class="tab-button" href="gallery.html">Gallery</a>
                <a class="tab-button" href="academics.html">Academics</a>
                <a class="tab-button" href="admissions.html">Admissions</a>
                <a class="tab-button" href="contact.html">Contact</a>
                <a class="tab-button" href="settings.html">Settings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <p class="kicker">DALE COLLEGE / CONTENT DESK</p>
                    <h1>Build the season board</h1>
                </div>
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                    <span id="admin-current-user" style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#5d5853;">Signed in as admin</span>
                    <a class="back-link" href="../index.html">View site <span>↗</span></a>
                    <button class="back-link" type="button" data-admin-logout style="background:#fff;">Log out</button>
                </div>
            </header>

            <section class="panel-block">
                <div class="panel-head">
                    <div>
                        <p class="kicker">03 / FIXTURES</p>
                        <h2>Sports updates</h2>
                    </div>
                </div>
                <form id="fixture-form" class="content-form fixture-form">
                    <label>Sport<select name="sport" required><option value="rugby">Rugby</option><option value="hockey">Hockey</option><option value="cricket">Cricket</option><option value="athletics">Athletics</option><option value="cross-country">Cross Country</option><option value="chess">Chess</option><option value="debating">Debating</option><option value="choir">Choir</option></select></label>
                    <label>Date<input type="date" name="date" required></label>
                    <label>Opposition<input name="opposition" required placeholder="Queen's College"></label>
                    <label>Venue<input name="venue" required placeholder="Home"></label>
                    <label>Team / event<input name="team" required placeholder="1st XV"></label>
                    <label>Link<input type="url" name="link" placeholder="https://..."></label>
                    <label>Status<input name="status" value="Details" placeholder="Details"></label>
                    <button type="submit">Add fixture <span>+</span></button>
                </form>
                <div id="fixture-list" class="saved-list fixture-list-admin"></div>
            </section>

            <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
        </main>
    </div>

    <script src="../js/content.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
